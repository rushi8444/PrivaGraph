services:
  neo4j:
    image: neo4j:5-community
    container_name: privagraph-neo4j
    ports:
      - "127.0.0.1:7687:7687"   # Bolt (driver)
      - "127.0.0.1:7474:7474"   # Browser UI → http://localhost:7474
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
